name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37"

      - name: Generate Android scaffold
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp -r lib /tmp/keep/lib
          flutter create --platforms=android --project-name personal_feed --org com.uxfarm.personalfeed --no-pub .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/keep/lib lib
          rm -rf test analysis_options.yaml

      - name: Patch Android manifest, folder picker, and SDK
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-feed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
