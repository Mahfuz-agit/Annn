version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: '>=2.8.0 <4.0.0'
  shared_preferences: '>=2.2.0 <4.0.0'
  path_provider: '>=2.1.0 <4.0.0'
  http: '>=1.1.0 <3.0.0'
  permission_handler: '>=11.3.0 <14.0.0'

flutter:
  uses-material-design: true
